name: Build Windows Installer

on:
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Cache PyInstaller build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-build-${{ runner.os }}-${{ hashFiles('transport_parser.py', 'requirements.txt') }}
          restore-keys: |
            pyinstaller-build-${{ runner.os }}-

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build one-file .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "TransportParser" transport_parser.py

      - name: Upload raw .exe artifact
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: TransportParser-exe
          path: dist/TransportParser.exe
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DMyAppVersion=$env:APP_VERSION installer.iss

      - name: Upload installer artifact
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: TransportParser-Setup
          path: Output/TransportParser-Setup.exe
          if-no-files-found: error

      - name: Post artifact download links
        uses: actions/github-script@v7
        with:
          script: |
            const exeUrl     = '${{ steps.upload-exe.outputs.artifact-url }}';
            const setupUrl   = '${{ steps.upload-installer.outputs.artifact-url }}';
            const runUrl     = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## 📦 Артефакты сборки',
              '',
              '| Файл | Ссылка |',
              '|------|--------|',
              `| \`TransportParser.exe\` (portable, без установки) | [⬇ Скачать](${exeUrl}) |`,
              `| \`TransportParser-Setup.exe\` (установщик) | [⬇ Скачать](${setupUrl}) |`,
              '',
              `> Ссылки действительны **90 дней**. Для скачивания необходим GitHub-аккаунт.`,
              `> [Страница раны Actions](${runUrl})`,
            ].join('\n');

            // 1. Job Summary — видно во вкладке «Summary» любой раны.
            await core.summary.addRaw(body).write();

            // 2. Комментарий в PR (только если есть открытый PR для этой ветки).
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.length === 0) return;

            const prNumber = prs[0].number;

            // Удаляем предыдущий комментарий с артефактами (при повторном push).
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.includes('Артефакты сборки')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/TransportParser-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
