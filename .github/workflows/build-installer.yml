name: Build Windows Installer

on:
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Cache PyInstaller build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-build-${{ runner.os }}-${{ hashFiles('transport_parser.py', 'requirements.txt') }}
          restore-keys: |
            pyinstaller-build-${{ runner.os }}-

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build one-file .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "TransportParser" transport_parser.py

      - name: Upload raw .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportParser-exe
          path: dist/TransportParser.exe
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DMyAppVersion=$env:APP_VERSION installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportParser-Setup
          path: Output/TransportParser-Setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/TransportParser-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
