name: Build Windows Installer

on:
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Cache PyInstaller build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-build-${{ runner.os }}-${{ hashFiles('transport_parser.py', 'requirements.txt') }}
          restore-keys: |
            pyinstaller-build-${{ runner.os }}-

      - name: Determine version and release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          else
            VERSION="1.0.0"
            # Безопасное имя тега: claude/fix-foo → dev-claude-fix-foo
            SAFE_BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            TAG="dev-${SAFE_BRANCH}"
            PRERELEASE=true
          fi
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Build one-file .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "TransportParser" transport_parser.py

      - name: Upload raw .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportParser-exe
          path: dist/TransportParser.exe
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DMyAppVersion=$env:APP_VERSION installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportParser-Setup
          path: Output/TransportParser-Setup.exe
          if-no-files-found: error

      - name: Publish release with downloadable files
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: >-
            ${{ steps.meta.outputs.prerelease == 'true'
                && format('Dev build — {0}', github.ref_name)
                || format('Release {0}', steps.meta.outputs.tag) }}
          prerelease: ${{ fromJSON(steps.meta.outputs.prerelease) }}
          files: |
            dist/TransportParser.exe
            Output/TransportParser-Setup.exe
          generate_release_notes: ${{ !fromJSON(steps.meta.outputs.prerelease) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write download link to job summary
        shell: bash
        run: |
          RELEASE_URL="${{ steps.release.outputs.url }}"
          {
            echo "## Скачать"
            echo ""
            echo "**[Открыть страницу релиза с файлами]($RELEASE_URL)**"
            echo ""
            echo "Файлы в релизе:"
            echo "- \`TransportParser.exe\` — portable, без установки"
            echo "- \`TransportParser-Setup.exe\` — установщик Windows"
          } >> "$GITHUB_STEP_SUMMARY"
